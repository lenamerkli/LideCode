<mat-toolbar class="app-toolbar">
  <button
    mat-icon-button
    type="button"
    (click)="sidenav.toggle()"
    matTooltip="Toggle chat list"
    aria-label="Toggle chat list"
  >
    <mat-icon svgIcon="menu"></mat-icon>
  </button>

  <span class="app-title">LideCode</span>
  <span class="spacer"></span>

  <span class="status" [matTooltip]="store.status()">{{ store.status() }}</span>

  <button mat-flat-button type="button" [disabled]="store.busy()" (click)="openNewChat()">
    <mat-icon svgIcon="add"></mat-icon>
    New chat
  </button>

  @if (store.busy()) {
    <button
      mat-icon-button
      type="button"
      (click)="store.cancel()"
      matTooltip="Stop generating"
      aria-label="Stop generating"
    >
      <mat-icon svgIcon="stop"></mat-icon>
    </button>
  }

  <button
    mat-icon-button
    type="button"
    [disabled]="store.busy() || !store.chatId()"
    (click)="confirmDelete()"
    matTooltip="Delete chat"
    aria-label="Delete chat"
  >
    <mat-icon svgIcon="delete"></mat-icon>
  </button>

  <button
    mat-icon-button
    type="button"
    (click)="openSettings()"
    matTooltip="Settings"
    aria-label="Settings"
  >
    <mat-icon svgIcon="settings"></mat-icon>
  </button>
</mat-toolbar>

@if (store.busy()) {
  <mat-progress-bar mode="indeterminate" class="busy-bar"></mat-progress-bar>
}

@if (store.docker(); as docker) {
  @if (!docker.available) {
    <div class="docker-banner">
      <mat-icon svgIcon="warning"></mat-icon>
      <span>{{ docker.message }}</span>
    </div>
  }
}

<mat-sidenav-container class="workspace">
  <mat-sidenav #sidenav mode="side" opened class="chat-sidenav">
    <app-chat-list (open)="openChat($event)" (newChat)="openNewChat()"></app-chat-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <app-chat-view (newChat)="openNewChat()"></app-chat-view>
  </mat-sidenav-content>
</mat-sidenav-container>
